<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Notify Stack</title>
<style>
  /* Farben und Maße aus Flows eigenem Stylesheet uebernommen, damit sich
     das Panel wie ein AE-Bordmittel anfuehlt und nicht wie ein Fremdkoerper. */
  :root {
    --panel: #303030;
    --dark: #272727;
    --line: #3d3d3d;
    --dim: #666666;
    --text: #cccccc;
    --white: #ffffff;
    --blue: #4a8ae4;
    --grid: #44444477;
    --card: #6f6f6f;
    --card-new: #4a8ae4;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--panel);
    color: var(--text);
    font: 12px 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background-color: var(--dark); }

  /* ---------- Vorschau: das Stueck, an dem man wirklich beurteilt ---------- */
  #stage {
    position: relative;
    flex: 0 0 auto;
    height: 210px;
    background-color: var(--dark);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #stageHint {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 8px; background: var(--dark);
    font-size: 10px; color: var(--dim); pointer-events: none;
  }
  #replay {
    position: absolute; right: 6px; top: 6px;
    font-size: 10px; color: var(--dim); padding: 3px 6px; cursor: pointer;
  }
  #replay:hover { color: var(--white); }

  /* ---------- Presets ---------- */
  #presets { display: flex; border-bottom: 1px solid var(--line); }
  .preset {
    flex: 1 1 0; text-align: center; padding: 7px 2px;
    font-size: 11px; color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .preset:hover { color: var(--white); }
  .preset.on { color: var(--blue); box-shadow: inset 0 -2px 0 0 var(--blue); }

  /* ---------- Regler ---------- */
  #scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding-bottom: 6px; }
  .group {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--dim); padding: 12px 10px 5px;
  }
  .row { padding: 3px 10px 7px; }
  .row .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .row label { font-size: 11px; color: var(--text); }
  .row .val {
    width: 46px; text-align: right; background: var(--dark); color: var(--white);
    border: 0; padding: 2px 4px; font: 11px/1.3 inherit; font-variant-numeric: tabular-nums;
  }
  .row .val:focus { outline: 1px solid var(--blue); }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 3px;
    background: var(--dark); outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 14px;
    background: var(--text); cursor: ew-resize;
  }
  input[type=range]:hover::-webkit-slider-thumb { background: var(--white); }
  input[type=range]:active::-webkit-slider-thumb { background: var(--blue); }

  .check { display: flex; align-items: center; gap: 7px; padding: 5px 10px 8px; cursor: pointer; }
  .check .box {
    width: 12px; height: 12px; background: var(--dark); flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .check.on .box { background: var(--blue); }
  .check .box::after { content: ''; width: 5px; height: 5px; background: var(--dark); }
  .check.on .box::after { background: var(--white); }
  .check span { font-size: 11px; }

  /* ---------- Fuss ---------- */
  #foot { flex: 0 0 auto; border-top: 1px solid var(--line); }
  #status {
    font-size: 10px; color: var(--dim); padding: 5px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.err { color: #eb590c; }
  #status.ok { color: var(--blue); }
  .actions { display: flex; }
  .btn {
    flex: 1 1 0; text-align: center; padding: 9px 4px; font-size: 12px;
    color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { color: var(--white); }
  .btn.primary { background: var(--blue); color: var(--white); font-size: 13px; flex: 1.6 1 0; }
  .btn.primary:hover { background: #5c97e8; }
  .btn.off { opacity: .35; cursor: default; }
  .btn.off:hover { color: var(--text); }
</style>
</head>
<body>

  <div id="stage">
    <canvas id="preview"></canvas>
    <div id="replay">↻ nochmal</div>
    <div id="stageHint">Vorschau — rechnet exakt wie das Rig</div>
  </div>

  <div id="presets">
    <div class="preset" data-p="ios">iOS</div>
    <div class="preset" data-p="weich">Weich</div>
    <div class="preset" data-p="knackig">Knackig</div>
    <div class="preset" data-p="bouncy">Bouncy</div>
  </div>

  <div id="scroll">
    <div class="group">Struktur</div>
    <div class="check" id="chkDir"><span class="box"></span><span>Neue Karte kommt von unten</span></div>
    <div class="check" id="chkFollow"><span class="box"></span><span>Stapel sitzt auf dem Null</span></div>
    <div id="rowsStruktur"></div>

    <div class="group">Einlauf der neuen Karte</div>
    <div id="rowsEinlauf"></div>

    <div class="group">Ausweichen der oberen</div>
    <div id="rowsAusweichen"></div>

    <div class="group">Tiefe nach oben</div>
    <div id="rowsTiefe"></div>
  </div>

  <div id="foot">
    <div id="status">Bereit</div>
    <div class="actions">
      <div class="btn" id="btnSync">Werte senden</div>
      <div class="btn primary" id="btnApply">Auf Auswahl anwenden</div>
    </div>
  </div>

<script src="main.js"></script>
</body>
</html>
