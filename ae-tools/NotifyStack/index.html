<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Notify Stack</title>
<style>
  /* Farben und Maße aus Flows eigenem Stylesheet uebernommen, damit sich
     das Panel wie ein AE-Bordmittel anfuehlt und nicht wie ein Fremdkoerper. */
  :root {
    --panel: #303030;
    --dark: #272727;
    --line: #3d3d3d;
    --dim: #666666;
    --text: #cccccc;
    --white: #ffffff;
    --blue: #4a8ae4;
    --grid: #44444477;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--panel);
    color: var(--text);
    font: 12px 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background-color: var(--dark); }

  /* ---------- Vorschau ---------- */
  #stage {
    position: relative; flex: 0 0 auto; height: 200px;
    background-color: var(--dark);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #stageHint {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 8px; background: var(--dark);
    font-size: 10px; color: var(--dim); pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #replay { position: absolute; right: 6px; top: 6px; font-size: 10px; color: var(--dim); padding: 3px 6px; }
  #replay:hover { color: var(--white); }

  /* ---------- Preset-Bibliothek (Liste wie in Flow) ---------- */
  #lib { border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #lib-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 10px 5px; font-size: 10px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--dim);
  }
  #lib-add { cursor: pointer; letter-spacing: 0; text-transform: none; font-size: 11px; }
  #lib-add:hover { color: var(--blue); }
  #lib-list { max-height: 148px; overflow-y: auto; }
  .pr {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    cursor: pointer; font-size: 11px;
  }
  .pr:hover { background: var(--dark); }
  .pr.on { color: var(--blue); box-shadow: inset 2px 0 0 0 var(--blue); }
  .pr canvas { flex: 0 0 auto; width: 34px; height: 18px; background: var(--dark); }
  .pr .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr .act { display: none; gap: 6px; flex: 0 0 auto; color: var(--dim); }
  .pr:hover .act { display: flex; }
  .pr .act i { font-style: normal; padding: 0 2px; }
  .pr .act i:hover { color: var(--white); }
  .pr input {
    flex: 1 1 auto; background: var(--panel); border: 0; color: var(--white);
    font: 11px inherit; padding: 2px 4px; outline: 1px solid var(--blue);
  }

  /* ---------- Gruppen ---------- */
  #scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; }
  .grp { border-bottom: 1px solid var(--line); }
  .grp-head { display: flex; align-items: baseline; gap: 6px; padding: 9px 10px 3px; cursor: pointer; }
  .grp-head .tw { color: var(--dim); font-size: 9px; width: 8px; flex: 0 0 auto; }
  .grp-head h2 {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    color: var(--text); margin: 0;
  }
  .grp-head:hover h2, .grp-head:hover .tw { color: var(--white); }
  .grp-sub { padding: 0 10px 7px 24px; font-size: 10px; color: var(--dim); line-height: 1.45; }
  .grp-body { padding-bottom: 5px; }
  .grp.zu .grp-body, .grp.zu .grp-sub { display: none; }

  /* ---------- Regler ---------- */
  .row { padding: 3px 10px 7px 24px; }
  .row .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .row label { font-size: 11px; }
  .row .val {
    width: 46px; text-align: right; background: var(--dark); color: var(--white);
    border: 0; padding: 2px 4px; font: 11px/1.3 inherit; font-variant-numeric: tabular-nums;
  }
  .row .val:focus { outline: 1px solid var(--blue); }
  .row .why { font-size: 10px; color: var(--dim); margin-top: 3px; line-height: 1.4; display: none; }
  body.erklaer .row .why { display: block; }

  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 3px;
    background: var(--dark); outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 9px; height: 14px; background: var(--text); cursor: ew-resize;
  }
  input[type=range]:hover::-webkit-slider-thumb { background: var(--white); }
  input[type=range]:active::-webkit-slider-thumb { background: var(--blue); }

  .check { display: flex; align-items: center; gap: 7px; padding: 4px 10px 6px 24px; cursor: pointer; }
  .check .box {
    width: 12px; height: 12px; background: var(--dark); flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .check.on .box { background: var(--blue); }
  .check .box::after { content: ''; width: 5px; height: 5px; background: var(--dark); }
  .check.on .box::after { background: var(--white); }
  .check span { font-size: 11px; }

  /* ---------- Fuss ---------- */
  #foot { flex: 0 0 auto; border-top: 1px solid var(--line); }
  #status {
    font-size: 10px; color: var(--dim); padding: 5px 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.err { color: #eb590c; }
  #status.ok { color: var(--blue); }
  .actions { display: flex; }
  .btn { flex: 1 1 0; text-align: center; padding: 9px 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { color: var(--white); }
  .btn.primary { background: var(--blue); color: var(--white); font-size: 13px; }
  .btn.primary:hover { background: #5c97e8; }
  .btn.on { color: var(--blue); }
</style>
</head>
<body>

  <div id="stage">
    <canvas id="preview"></canvas>
    <div id="replay">↻ nochmal</div>
    <div id="stageHint">Vorschau — rechnet exakt wie das Rig</div>
  </div>

  <div id="lib">
    <div id="lib-head"><span>Presets</span><span id="lib-add">＋ sichern</span></div>
    <div id="lib-list"></div>
  </div>

  <div id="scroll"></div>

  <div id="foot">
    <div id="status">Bereit</div>
    <div class="actions">
      <div class="btn" id="btnHelp">Erklärungen</div>
      <div class="btn" id="btnNew">＋ Karte hier</div>
      <div class="btn" id="btnClear" title="Ohne Auswahl: alle Karten der Komposition">Rig lösen</div>
    </div>
    <div class="actions">
      <div class="btn primary" id="btnApply">Auf Auswahl anwenden</div>
    </div>
  </div>

<script src="main.js"></script>
</body>
</html>
